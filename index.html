  <style>
    :root {
      --card-width: 280px;
      --card-height: 180px;
      --cute-font: 'Patrick Hand', cursive;
      --text-color: #003366;
      --correct-color: #28a745;
      --wrong-color: #dc3545;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url("https://images.rawpixel.com/image_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIzLTA5L3Jhd3BpeGVsb2ZmaWNlNl9icm93bl9ncmlkX21hdGhfcGFwZXJfdGV4dHVyZV9faXNvbGF0ZWRfb25fYV93aF82YmQ2Mjg2OC1hZDA2LTQ0NDItOWUyYS05NjkzZjZjNjBjOTZfMS5qcGc.jpg");
      background-size: 1000px;
      background-position: center center;
      margin: 0;
      overflow: hidden;
      font-family: var(--cute-font);
      color: var(--text-color);
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    #card-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Card Structure & Flip Animation */
    .paper {
      width: var(--card-width);
      height: var(--card-height);
      position: absolute;
      cursor: grab;
      transform-origin: center center;
      opacity: 0;
      scale: 0.8;
      transition: opacity 0.5s ease-out, scale 0.5s ease-out;
      pointer-events: none;
      perspective: 1000px; /* For 3D flip effect */
    }

    .paper.show {
      opacity: 1;
      scale: 1;
      pointer-events: auto;
    }
    
    .paper.grabbing {
      cursor: grabbing;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      box-shadow: 1px 15px 20px 0px rgba(0,0,0,0.25);
      border-radius: 10px;
    }

    .paper.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background-image: url("https://img.freepik.com/free-photo/design-space-paper-textured-background_53876-147801.jpg?semt=ais_hybrid&w=740");
      background-size: 500px;
      border-radius: 10px;

    }

    .card-back {
      transform: rotateY(180deg);
    }

    .paper p {
      margin: 0;
      text-align: center;
      pointer-events: none;
      line-height: 1.4;
    }
    
    .card-front p {
      font-size: clamp(17px, 4vw, 20px);
      font-weight: bold;
    }
    
    .card-back p {
      font-size: clamp(16px, 4vw, 19px);
    }

    /* --- Buttons --- */
    .button-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 10000;
    }

    #random-q-btn, #about-btn {
      padding: 12px 24px;
      font-family: var(--cute-font);
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    #random-q-btn:hover, #about-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
    
    #random-q-btn:active, #about-btn:active {
      transform: translateY(1px);
    }

    #random-q-btn {
      background-color: #ffc107;
      color: #333;
      border: 2px solid #333;
    }

    #about-btn {
      background-color: #17a2b8; /* Cyan color */
      color: white;
      border: 2px solid #107281;
    }

    /* --- Modal Base --- */
    #quiz-modal, #about-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    #quiz-modal.show, #about-modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    
    /* --- IMPROVED Quiz Modal --- */
    .quiz-content {
        background-image: url("https://www.psdgraphics.com/wp-content/uploads/2022/01/white-math-paper-texture.jpg");
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        width: 90%;
        max-width: 550px;
        text-align: center;
        border: 5px solid #e0e0e0;
        position: relative;
        transform: scale(0.95);
        transition: transform 0.3s ease-out;
    }
    #quiz-modal.show .quiz-content {
        transform: scale(1);
    }
    .quiz-header {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px dashed rgba(0, 51, 102, 0.2);
    }
    .quiz-title {
        margin: 0;
        font-size: clamp(24px, 5vw, 28px);
        color: var(--text-color);
    }
    .quiz-close-btn {
        position: absolute;
        top: -15px;
        right: -10px;
        background: #fff;
        border: 2px solid #ccc;
        border-radius: 50%;
        width: 35px;
        height: 35px;
        font-size: 24px;
        font-weight: bold;
        color: #888;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        padding: 0;
        transition: all 0.2s ease;
    }
    .quiz-close-btn:hover {
        color: #333;
        border-color: #333;
        transform: rotate(90deg);
    }
    .quiz-question {
        font-size: clamp(18px, 4vw, 22px);
        margin-bottom: 25px;
        line-height: 1.5;
        color: #333;
    }
    .quiz-options {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
    }
    .quiz-option {
        padding: 14px;
        border: 2px solid var(--text-color);
        border-radius: 10px;
        font-size: clamp(16px, 4vw, 18px);
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        background-color: #fff;
        position: relative;
    }
    .quiz-option:hover {
        background-color: rgba(0, 51, 102, 0.1);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .quiz-options.answered .quiz-option {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .quiz-options.answered .quiz-option:hover {
        transform: none;
        box-shadow: none;
    }
    .quiz-options.answered .quiz-option.correct,
    .quiz-options.answered .quiz-option.wrong {
        opacity: 1;
        transform: scale(1.03);
    }
    .quiz-option.correct {
        background-color: var(--correct-color);
        color: white;
        border-color: #1e7e34;
    }
    .quiz-option.wrong {
        background-color: var(--wrong-color);
        color: white;
        border-color: #b21f2d;
    }
    .quiz-option.correct::after {
        content: '✔';
        position: absolute;
        right: 15px;
        font-weight: bold;
    }
    .quiz-option.wrong::after {
        content: '✖';
        position: absolute;
        right: 15px;
        font-weight: bold;
    }
    .quiz-feedback {
        margin-top: 25px;
        font-size: 18px;
        min-height: 25px;
        line-height: 1.5;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .quiz-feedback.show {
        opacity: 1;
        transform: translateY(0);
    }
    .quiz-feedback-result {
        font-weight: bold;
        font-size: 20px;
    }
    .quiz-feedback-result.correct { color: var(--correct-color); }
    .quiz-feedback-result.wrong { color: var(--wrong-color); }
    .quiz-feedback-reason {
        font-size: 17px;
        color: #555;
        margin-top: 8px;
        background: rgba(0,0,0,0.04);
        padding: 10px;
        border-radius: 8px;
    }
    .quiz-actions {
        margin-top: 20px;
        min-height: 50px;
    }
    #next-question-btn {
        padding: 12px 28px;
        font-family: var(--cute-font);
        font-size: 18px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        background-color: #ffc107;
        color: #333;
        border: 2px solid #333;
        animation: pop-in 0.5s ease-out;
    }
    #next-question-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
    @keyframes pop-in {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

    /* --- About Modal --- */
    .about-content {
      background-image: url("https://www.psdgraphics.com/wp-content/uploads/2022/01/white-math-paper-texture.jpg");
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 90%;
      max-width: 400px;
      text-align: center;
      border: 5px solid #e0e0e0;
      font-size: clamp(20px, 5vw, 24px);
      line-height: 1.6;
    }
    .about-content p:first-child {
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* Loading Screen */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }
    .loaded #loadingScreen {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      border: 8px solid rgba(255, 255, 255, 0.2);
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spinner + p {
      margin-top: 25px;
      font-size: 16px;
      color: #f0f0f0;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      :root {
        --card-width: 240px;
        --card-height: 160px;
      }
      #random-q-btn, #about-btn {
        padding: 10px 20px;
        font-size: 16px;
      }
    }

    @media (min-width: 600px) {
      .quiz-options {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Loading your study cards...</p>
  </div>

  <div id="card-container"></div>
  
  <div class="button-container">
    <button id="about-btn">About!</button>
    <button id="random-q-btn">Quiz!</button>
  </div>

  <div id="quiz-modal">
    <div class="quiz-content">
      <div class="quiz-header">
        <h2 class="quiz-title">Pop Quiz! 💡</h2>
        <button id="quiz-close-btn" class="quiz-close-btn">&times;</button>
      </div>
      <p class="quiz-question" id="quiz-question-text"></p>
      <div class="quiz-options" id="quiz-options-container"></div>
      <div class="quiz-feedback" id="quiz-feedback-container"></div>
      <div class="quiz-actions" id="quiz-actions-container"></div>
    </div>
  </div>

  <div id="about-modal">
    <div class="about-content">
      <p>Programmed by Sas!<br>Only for Gly!</p>
    </div>
  </div>

<script>
// --- DATA ---
const flashcardData = [
  // The first 3 cards will be the "Top Notes" that appear at the top on load
  { 
    note: "The Classical Cell Theory: The 3 essential rules that define all life on Earth.",
    explanation: "Life has three main rules: 1. Everything alive is made of cells. 2. The cell is the smallest living thing. 3. Cells only come from other cells splitting in two.",

    quizReasoning: "These three principles are the foundation of biology, explaining what living things are and where they come from."
  },
  { 
    note: "The Cell Membrane: A flexible lipid bilayer that acts as the cell's protective gatekeeper, controlling what comes in and what goes out.",
    explanation: "This is the cell's squishy, smart skin! It acts like a bouncer at a club, deciding which molecules get to come in and which have to leave.",
    quizTitle: "Cell Membrane",
    quizReasoning: "Its main job is being 'selectively permeable', meaning it protects the cell while allowing necessary materials to pass through."
  },
  { 
    note: "The Nucleus: The large organelle that acts as the cell's brain or control center because it holds all the genetic instructions (DNA).",
    explanation: "The nucleus is the boss of the cell! It's like a tiny brain that holds the master blueprint (DNA) and tells all the other parts what to do.",
    quizTitle: "Nucleus",
    quizReasoning: "By containing the DNA, the nucleus is responsible for controlling all cell activities, including growth and reproduction."
  },
  // --- Microscope History ---
  {

    explanation: "A long time ago, a dad and his son figured out that if you put two glass lenses together, you could make tiny things look huge! They started it all.",

  {

    explanation: "This guy looked at cork with his microscope and saw a bunch of tiny, empty boxes. They reminded him of little rooms, so he called them 'cells'!",

  { 
    note: "Antonie van Leeuwenhoek, a Dutch shopkeeper, created incredibly powerful single-lens microscopes and was the first person to see living cells.",
    explanation: "Leeuwenhoek made a game-changing microscope and looked at pond water. He was shocked to see tiny creatures swimming around! He called them 'animalcules'.",

  },
  // --- Cell Structures & Organelles ---
  { 
    note: "The Nucleolus: A dense structure found inside the nucleus responsible for producing ribosomes.",
    explanation: "This is a tiny factory inside the main office (the nucleus). Its only job is to build the cell's protein-making machines (ribosomes).",

  {

  {

    quizReasoning: "The cytoplasm is more than just jelly; it's where many of the cell's metabolic chemical reactions happen."
  },
  {

  {

// --- CORE LOGIC (Flashcards) ---
// --- FIX --- highestZ now starts based on the number of cards to work with the initial z-index setting.
let highestZ = flashcardData.length;

class PaperDragger {
  constructor(paper, index) {
    this.paper = paper;
    this.isDragging = false;
    this.hasMoved = false;

    const NUM_TOP_NOTES = 3;
    if (index < NUM_TOP_NOTES) {
      const cardWidth = 280; 
      const spacing = 20;
      const totalWidth = (NUM_TOP_NOTES * cardWidth) + ((NUM_TOP_NOTES - 1) * spacing);
      const startX = (window.innerWidth - totalWidth) / 2;
      
      this.currentX = startX + (index * (cardWidth + spacing));
      this.currentY = 40;
      this.rotation = 0;
    } else {
      const rect = paper.getBoundingClientRect();
      const centerX = window.innerWidth / 2 - rect.width / 2;
      const centerY = window.innerHeight / 2 - rect.height / 2;
      const offsetX = Math.random() * (window.innerWidth * 0.4) - (window.innerWidth * 0.2);
      const offsetY = Math.random() * (window.innerHeight * 0.4) - (window.innerHeight * 0.2);

      this.currentX = centerX + offsetX;
      this.currentY = centerY + offsetY;
      this.rotation = Math.random() * 20 - 10;
    }

    this.startX = 0;
    this.startY = 0;
    this.init();
  }

  init() {
    this.paper.style.transform = `translateX(${this.currentX}px) translateY(${this.currentY}px) rotate(${this.rotation}deg)`;
    
    this.onStart = this.onStart.bind(this);
    this.onMove = this.onMove.bind(this);
    this.onEnd = this.onEnd.bind(this);

    this.paper.addEventListener('mousedown', this.onStart);
    this.paper.addEventListener('touchstart', this.onStart, { passive: false });
  }

  onStart(e) {
    e.preventDefault();
    this.hasMoved = false;
    this.isDragging = true;
    
    // This part now correctly brings any card to the absolute front when clicked.
    this.paper.style.zIndex = ++highestZ;
    this.paper.classList.add('grabbing');

    const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

    this.startX = clientX - this.currentX;
    this.startY = clientY - this.currentY;

    document.addEventListener('mousemove', this.onMove);
    document.addEventListener('touchmove', this.onMove, { passive: false });
    document.addEventListener('mouseup', this.onEnd);
    document.addEventListener('touchend', this.onEnd);
  }

  onMove(e) {
    if (!this.isDragging) return;
    e.preventDefault();

    const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

    const newX = clientX - this.startX;
    const newY = clientY - this.startY;
    
    if (!this.hasMoved && (Math.abs(newX - this.currentX) > 5 || Math.abs(newY - this.currentY) > 5)) {
        this.hasMoved = true;
    }

    this.currentX = newX;
    this.currentY = newY;
    this.paper.style.transform = `translateX(${this.currentX}px) translateY(${this.currentY}px) rotate(${this.rotation}deg)`;
  }

  onEnd() {
    if (!this.isDragging) return;
    
    if (!this.hasMoved) {
      this.paper.classList.toggle('is-flipped');
    }
    
    this.isDragging = false;
    this.paper.classList.remove('grabbing');

    document.removeEventListener('mousemove', this.onMove);
    document.removeEventListener('touchmove', this.onMove);
    document.removeEventListener('mouseup', this.onEnd);
    document.removeEventListener('touchend', this.onEnd);
  }
}

// --- IMPROVED QUIZ LOGIC ---
const quizModal = document.getElementById('quiz-modal');
const quizCloseBtn = document.getElementById('quiz-close-btn');
const questionText = document.getElementById('quiz-question-text');
const optionsContainer = document.getElementById('quiz-options-container');
const feedbackContainer = document.getElementById('quiz-feedback-container');
const quizActionsContainer = document.getElementById('quiz-actions-container');
let correctAnswerInfo = null;

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function showRandomQuestion() {
  feedbackContainer.innerHTML = '';
  feedbackContainer.classList.remove('show');
  quizActionsContainer.innerHTML = '';
  optionsContainer.classList.remove('answered');

  const questionItem = flashcardData[Math.floor(Math.random() * flashcardData.length)];
  correctAnswerInfo = questionItem;

  const distractors = flashcardData
    .filter(item => item.quizTitle !== correctAnswerInfo.quizTitle)
    .sort(() => 0.5 - Math.random())
    .slice(0, 3);
  
  const options = [correctAnswerInfo, ...distractors];
  shuffleArray(options);
  
  questionText.textContent = correctAnswerInfo.explanation;
  optionsContainer.innerHTML = '';
  options.forEach(option => {
    const button = document.createElement('div');
    button.className = 'quiz-option';
    button.textContent = option.quizTitle;
    button.addEventListener('click', handleOptionClick);
    optionsContainer.appendChild(button);
  });
  
  quizModal.classList.add('show');
}

function handleOptionClick(e) {
  const selectedOption = e.target;
  const isCorrect = selectedOption.textContent === correctAnswerInfo.quizTitle;
  
  optionsContainer.classList.add('answered');
  Array.from(optionsContainer.children).forEach(btn => {
    btn.removeEventListener('click', handleOptionClick);
    if (btn.textContent === correctAnswerInfo.quizTitle) {
        btn.classList.add('correct');
    }
  });

  let feedbackHTML = '';
  if (isCorrect) {
    selectedOption.classList.add('correct');
    feedbackHTML = `<span class="quiz-feedback-result correct">That's Right! 🎉</span>`;
  } else {
    selectedOption.classList.add('wrong');
    feedbackHTML = `<span class="quiz-feedback-result wrong">Not quite!</span>`;
  }
  
  feedbackHTML += `<div class="quiz-feedback-reason">${correctAnswerInfo.quizReasoning}</div>`;
  feedbackContainer.innerHTML = feedbackHTML;
  setTimeout(() => feedbackContainer.classList.add('show'), 10);
  
  const nextButton = document.createElement('button');
  nextButton.id = 'next-question-btn';
  nextButton.textContent = 'Next Question ➡️';
  nextButton.addEventListener('click', showRandomQuestion);
  quizActionsContainer.appendChild(nextButton);
}

function closeQuizModal() {
    quizModal.classList.remove('show');
}

// --- INITIALIZATION ---
document.addEventListener('DOMContentLoaded', () => {
  const cardContainer = document.getElementById('card-container');

  flashcardData.forEach((item, index) => { 
    const paper = document.createElement('div');
    paper.className = 'paper';
    
    // --- FIX --- This sets the initial stacking order. The first card (index 0) gets the highest z-index.
    paper.style.zIndex = flashcardData.length - index;
    
    paper.innerHTML = `
      <div class="card-inner">
        <div class="card-front"><p>${item.note}</p></div>
        <div class="card-back"><p>${item.explanation}</p></div>
      </div>
    `;
    cardContainer.appendChild(paper);
    new PaperDragger(paper, index);
  });
  
  document.getElementById('random-q-btn').addEventListener('click', showRandomQuestion);
  quizCloseBtn.addEventListener('click', closeQuizModal);
  quizModal.addEventListener('click', (e) => {
    if(e.target === quizModal) closeQuizModal();
  });

  const aboutBtn = document.getElementById('about-btn');
  const aboutModal = document.getElementById('about-modal');
  aboutBtn.addEventListener('click', () => {
    aboutModal.classList.add('show');
  });
  aboutModal.addEventListener('click', (e) => {
    if (e.target === aboutModal) {
      aboutModal.classList.remove('show');
    }
  });

  window.addEventListener("load", () => {
    document.body.classList.add("loaded");
    const papers = Array.from(document.querySelectorAll('.paper'));
    papers.forEach((paper, index) => {
      setTimeout(() => {
        paper.classList.add('show');
      }, 100 * (index + 1));
    });
  });

  document.addEventListener('contextmenu', e => e.preventDefault());
});
</script>
